services:
  turn:
    image: coturn/coturn@sha256:0c0e8fc0c263b85a134e9e4242b5e46e1f4c077c5029633511191c05b5c2c814
    container_name: webrtc-turn
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "test -r /etc/coturn/turnserver.conf || { echo 'TURN config is unreadable' >&2; exit 1; }; exec turnserver -c /etc/coturn/turnserver.conf"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "test -r /etc/coturn/turnserver.conf && timeout 3 bash -c '</dev/tcp/127.0.0.1/3478'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
